name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Claude Code guard hooks (.claude/hooks/): labelled cases, run through
      # the real hook processes. Stdlib Python, no network.
      - name: Guard hook tests
        run: |
          python3 .claude/hooks/test_guard_fetch_exec.py
          python3 .claude/hooks/test_guard_commit_secrets.py

      # Backstop for commits made outside Claude Code (web edits, local git).
      - name: Secret scan of this branch
        run: |
          if git merge-base origin/main HEAD >/dev/null 2>&1; then
            python3 .claude/hooks/guard_commit_secrets.py --range origin/main...HEAD
          else
            echo "No common ancestor with main (pre-2026-08-28 history); skipping."
          fi

      - name: Docs links and Mermaid
        run: python3 scripts/check_docs.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
        with:
          job-id: morphe-build-v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Native ad-hook (libignite memcpy GOT hook). The .so is compiled from
      # source here so a push can never silently ship a stale prebuilt blob.
      - name: Native host unit tests
        run: |
          cd experimental/primevideo-libignite-native/jni
          g++ -std=c++17 -Wall -O2 test_remote_strip.cpp remote_strip.cpp -o test_remote_strip
          ./test_remote_strip

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          # local-cache stored a partial NDK (toolchain dir present but the
          # clang/clang++ binaries missing), and every run restored that broken
          # copy → "CMAKE_C_COMPILER ... is not a full path to an existing
          # compiler tool", failing the native libpvhook.so build on all PRs.
          # Download a fresh NDK each run instead — reliable over cache-fast.
          local-cache: false

      - name: Build libpvhook.so (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd experimental/primevideo-libignite-native/jni
          cmake -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-23 -B build-v7a
          cmake --build build-v7a
          install -m 0644 build-v7a/libpvhook.so \
            ../../../patches/src/main/resources/native/armeabi-v7a/libpvhook.so
          file ../../../patches/src/main/resources/native/armeabi-v7a/libpvhook.so

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid generatePatchesList
